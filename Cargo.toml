[package]
name = "eva"
authors = ["Nathan Fisher"]
description = "A gemini (and Gopher/Finger) browser in Gtk4"
homepage = "https://codeberg.org/jeang3nie/eva"
repository = "https://codeberg.org/jeang3nie/eva"
version = "0.4.1"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0"
keywords = ["gemini", "gopher", "gtk", "network"]
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gemview = { path = "vendor/gemview" }
mime2ext = "0.1"
fastrand = "2.5"
toml = "1.1"
url = "2.5"
urlencoding = "2.1"

[dependencies.adw]
version = "0.9"
package = "libadwaita"
features = ["v1_3"]

[dependencies.chrono]
version = "0.4"
features = ["std", "serde"]

[dependencies.gtk]
version = "0.11"
package = "gtk4"
features = ["v4_22"]

[dependencies.rgba_simple]
version = "0.10"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
lto = true
codegen-units = 1
strip = true
